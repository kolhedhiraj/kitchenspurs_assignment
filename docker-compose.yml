services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: local-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      analytics:
        aliases:
          - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    working_dir: /var/www/html
    command: sh -c "composer install --no-interaction && PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=0.0.0.0 --port=8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: analytics
      DB_USERNAME: analytics
      DB_PASSWORD: local-dev-password
      ANALYTICS_APPLICATION_ID: restaurant-demo
      ANALYTICS_API_URL: http://127.0.0.1:8000/api/v1/events
      BROWSER_INGESTION_KEY: local-browser-key-change-me
      SERVER_INGESTION_KEY: local-server-secret-change-me
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    networks:
      - analytics
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  api_vendor:

networks:
  analytics:
    driver: bridge
